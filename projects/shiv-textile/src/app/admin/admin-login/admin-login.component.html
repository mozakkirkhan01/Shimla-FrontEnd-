<app-progress *ngIf="dataLoading"></app-progress>
<main>
    <div class="container">

        <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center" >

                        <div class="d-flex justify-content-center" >
                            <img src="assets/img/logo.png" alt="" style="width: 60px;">
                        </div><!-- End Logo -->
                        <h2 ><span style="color:#c7135a">SHIV</span>&nbsp;<span style="color:#f89738">TEXTILE</span></h2>
                        <div class="card mb-3">

                            <div class="card-body">

                                <div class="pt-4 pb-2">
                                    <h5 class="card-title text-center pb-0 fs-4">Login to Your Account</h5>
                                    <p class="text-center small">Enter your username & password to login</p>
                                </div>

                                <form #myForm="ngForm" class="row g-3 needs-validation" novalidate>

                                    <div class="col-12">
                                        <label for="yourUsername" class="form-label">Username</label>
                                        <div class="input-group has-validation">
                                            <span class="input-group-text" id="inputGroupPrepend">@</span>
                                            <input type="text" name="UserName" #UserName="ngModel" placeholder="Enter username"
                                                [(ngModel)]="Employee.UserName"
                                                [ngClass]="{'is-invalid':submitted && UserName.invalid}"
                                                class="form-control" id="yourUsername" required>
                                            <div *ngIf="UserName.invalid && (UserName.dirty || UserName.touched || submitted)"
                                                class="invalid-feedback">
                                                <div *ngIf="UserName.errors?.['required']">
                                                    Please enter your username.
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <label for="yourPassword" class="form-label">Password</label>
                                        <input type="password" name="LoginPassword" placeholder="Enter Login password" class="form-control" id="yourPassword" #LoginPassword="ngModel" [(ngModel)]="Employee.LoginPassword"
                                        [ngClass]="{'is-invalid':submitted && LoginPassword.invalid}"   required>
                                        <div *ngIf="LoginPassword.errors?.['required'] && LoginPassword.invalid && (LoginPassword.dirty || LoginPassword.touched || submitted)" class="invalid-feedback">Please enter your password!</div>
                                    </div>

                                    <!-- <div class="col-12">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="remember" value="true"
                                                id="rememberMe">
                                            <label class="form-check-label" for="rememberMe">Remember me</label>
                                        </div>
                                    </div> -->
                                    <div class="col-12">
                                        <button class="btn btn-primary w-100" type="submit" (click)="employeeLogin(myForm)">Login</button>
                                    </div>
                                    <!-- <div class="col-12">
                                        <p class="small mb-0">Don't have account? <a>Create
                                                an account</a></p>
                                    </div> -->
                                </form>

                            </div>
                        </div>

                        <div class="credits">
                            <!-- All the links in the footer should remain intact. -->
                            <!-- You can delete the links only if you purchased the pro version. -->
                            <!-- Licensing information: https://bootstrapmade.com/license/ -->
                            <!-- Purchase the pro version with working PHP/AJAX contact form: https://bootstrapmade.com/nice-admin-bootstrap-admin-html-template/ -->
                            <!-- Designed by <a >WebAikon</a> -->
                        </div>

                    </div>
                </div>
            </div>

        </section>

    </div>
</main><!-- End #main -->

<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
        class="bi bi-arrow-up-short"></i></a>
